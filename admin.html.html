<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Roses · Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0a0810; --surface: #17141f; --rose: #e68caf; --gold: #f0cc55; --text: #f5f0f3; --dim: #6e6472; --success: #2ecc71; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    h1 { font-family: 'Playfair Display', serif; color: var(--rose); margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card { background: var(--surface); padding: 20px; border-radius: 12px; border: 1px solid #2a2634; }
    .card h3 { font-size: 0.8rem; color: var(--dim); text-transform: uppercase; margin-bottom: 10px; }
    .card p { font-size: 1.8rem; font-weight: 800; color: var(--gold); }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid #2a2634; font-size: 0.9rem; }
    th { background: #1f1b2b; color: var(--rose); font-weight: 600; }
    .tag { padding: 4px 8px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; }
    .tag.ok { background: rgba(46, 204, 113, 0.2); color: var(--success); }
    .tag.low { background: rgba(255, 77, 109, 0.2); color: #ff4d6d; }
    .btn { padding: 10px 20px; background: var(--rose); color: var(--bg); border: none; border-radius: 50px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h1>🌹 Shop Roses · Admin</h1>
    <button class="btn" onclick="cargarTodo()">↻ Actualizar</button>
  </div>

  <div class="grid">
    <div class="card"><h3>Ventas Hoy</h3><p id="statVentas">$0</p></div>
    <div class="card"><h3>Pedidos Hoy</h3><p id="statPedidos">0</p></div>
    <div class="card"><h3>Prendas en Stock</h3><p id="statStock">0</p></div>
  </div>

  <h3 style="margin-bottom:15px; color:var(--rose);">⚠️ Alerta de Inventario Bajo</h3>
  <table>
    <thead><tr><th>Producto</th><th>Stock</th><th>Estado</th></tr></thead>
    <tbody id="tablaStock"></tbody>
  </table>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyMZXHusnZeH5EwZo0RkbbjSm-ngJJTuoV8gncEUzzM1G-I3yxD6R6L3HvegCfz_V3w/exec';

    async function cargarTodo() {
      // En un caso real, aquí pediríamos los datos al Apps Script (getStats y getProducts)
      // Para mantenerlo simple, esto es un ejemplo visual.
      document.getElementById('statVentas').textContent = 'Cargando...';
      
      try {
        const res = await fetch(API_URL + '?action=getStats&t=' + Date.now());
        const data = await res.json();
        if(data.status === 'success') {
          document.getElementById('statVentas').textContent = '$' + data.stats.ventasHoy;
          document.getElementById('statPedidos').textContent = data.stats.empacados + data.stats.pendientes;
        }

        const resProd = await fetch(API_URL + '?action=getProducts&t=' + Date.now());
        const dataProd = await resProd.json();
        let stockTotal = 0;
        let bajos = [];

        if(dataProd.status === 'success') {
          dataProd.products.forEach(p => {
            stockTotal += Number(p.Stock);
            if(Number(p.Stock) <= 3) {
              bajos.push(`<tr><td>${p.Nombre}</td><td>${p.Stock}</td><td><span class="tag ${p.Stock==0?'low':'ok'}">${p.Stock==0?'Agotado':'Bajo'}</span></td></tr>`);
            }
          });
          document.getElementById('statStock').textContent = stockTotal;
          document.getElementById('tablaStock').innerHTML = bajos.join('') || '<tr><td colspan="3">Todo el inventario está saludable</td></tr>';
        }
      } catch(e) {
        console.error(e);
        alert('Error cargando datos');
      }
    }
    cargarTodo();
  </script>
</body>
</html>

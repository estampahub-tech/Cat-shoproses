<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Roses · Portal de Aliados</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #0a0810; color: #f5f0f3; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 500px; background: #17141f; padding: 30px; border-radius: 16px; border: 1px solid #e68caf; margin-top: 50px; }
    h1 { color: #e68caf; text-align: center; font-size: 1.5rem; margin-bottom: 20px; }
    input, select { width: 100%; padding: 12px; margin-bottom: 15px; background: #0a0810; border: 1px solid #444; border-radius: 8px; color: white; outline: none; }
    input:focus, select:focus { border-color: #e68caf; }
    button { width: 100%; padding: 15px; background: #e68caf; color: #0a0810; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #loginScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; }
    .hidden { display: none !important; }
    #msg { text-align: center; margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <div id="loginScreen">
    <h1 style="color:#e68caf; margin-bottom:20px;">🌹 Portal de Aliados</h1>
    <input type="password" id="accessCode" placeholder="Clave de aliado" style="max-width:300px;">
    <button onclick="verificarAcceso()" style="max-width:300px;">Entrar</button>
  </div>

  <div id="formScreen" class="container hidden">
    <h1>Subir Prenda a Vitrina</h1>
    <p style="text-align:center; font-size:0.8rem; color:#b0a5b3; margin-bottom:20px;">Shop Roses la venderá y te pagaremos tu costo al final del día.</p>
    
    <form id="productForm">
      <input type="text" id="nombre" placeholder="Nombre de la prenda" required>
      <select id="categoria" required>
        <option value="">Selecciona categoría...</option>
        <option value="Camisetas">Camisetas</option>
        <option value="Jeans">Jeans</option>
        <option value="Vestidos">Vestidos</option>
        <option value="Blusas">Blusas</option>
        <option value="Accesorios">Accesorios</option>
      </select>
      <input type="number" id="precio_costo" placeholder="Tu precio (lo que te pagamos)" required>
      <input type="number" id="precio_venta" placeholder="Precio al público (con ganancia)" required>
      <input type="number" id="stock" placeholder="Cantidad en stock" required>
      <input type="text" id="tallas" placeholder="Tallas (ej: S, M, L o Única)" required>
      <input type="url" id="imagen" placeholder="Enlace de la foto (URL de Google Drive o Imgur)" required>
      <input type="text" id="proveedor" placeholder="Nombre de tu local" required>
      <button type="submit" id="btnSubmit">Subir Prenda</button>
    </form>
    <p id="msg"></p>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw7gnp6dx6DywtMtapzZttYTWaq1pG43XTNvpExw2IVkARrsHIiXUCSf7MhiizMJpJ9GA/exec';

    function verificarAcceso() {
      const code = document.getElementById('accessCode').value.trim();
      if (code === 'p_shoproses') {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('formScreen').classList.remove('hidden');
      } else {
        alert('Clave incorrecta');
      }
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const msg = document.getElementById('msg');
      
      btn.textContent = 'Subiendo...';
      btn.disabled = true;
      msg.textContent = '';

      const payload = {
        action: 'addProduct',
        nombre: document.getElementById('nombre').value,
        categoria: document.getElementById('categoria').value,
        precio_costo: document.getElementById('precio_costo').value,
        precio_venta: document.getElementById('precio_venta').value,
        stock: document.getElementById('stock').value,
        tallas: document.getElementById('tallas').value,
        imagen: document.getElementById('imagen').value,
        proveedor: document.getElementById('proveedor').value
      };

      // Temporizador de seguridad (10 segundos máximo)
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 10000);

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          signal: controller.signal
        });
        
        clearTimeout(timeoutId);
        const data = await res.json();
        
        if(data.status === 'success') {
          msg.style.color = '#2ecc71';
          msg.textContent = '¡Prenda subida con éxito! Pendiente de aprobación.';
          document.getElementById('productForm').reset();
        } else {
          throw new Error(data.message || 'Error del servidor');
        }
      } catch(err) {
        clearTimeout(timeoutId);
        msg.style.color = '#ff4d6d';
        if (err.name === 'AbortError') {
          msg.textContent = 'El servidor tardó mucho en responder. Verifica tu Apps Script.';
        } else {
          msg.textContent = 'Error al subir. Avisa al administrador.';
        }
      } finally {
        btn.textContent = 'Subir Prenda';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>

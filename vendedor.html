<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0810">
  <title>Shop Roses · Panel Vendedor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendedor.css">
  <style>
    /* Estilos para la pantalla de bloqueo */
    #loginScreen {
      position: fixed; inset: 0; z-index: 99999;
      background: #0a0810; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px;
    }
    #loginScreen h2 { font-family: 'Playfair Display', serif; color: #e68caf; font-size: 2rem; margin-bottom: 20px; text-align: center; }
    #loginScreen input {
      padding: 15px 20px; border-radius: 50px; border: 1px solid rgba(230, 140, 175, 0.4);
      background: #17141f; color: white; font-size: 1.2rem; text-align: center;
      width: 100%; max-width: 300px; margin-bottom: 15px; outline: none;
    }
    #loginScreen button {
      padding: 15px 40px; border-radius: 50px; border: none;
      background: linear-gradient(135deg, #f5a8c5, #e68caf); color: #0a0810;
      font-size: 1.1rem; font-weight: bold; cursor: pointer; width: 100%; max-width: 300px;
    }
    #loginError { color: #ff4d6d; margin-top: 10px; font-size: 0.9rem; display: none; }
    .hidden-app { display: none !important; }
  </style>
</head>
<body>

  <!-- PANTALLA DE BLOQUEO VENDEDORES -->
  <div id="loginScreen">
    <h2>🌹 Panel Vendedor</h2>
    <p style="color:#b0a5b3; margin-bottom:20px; text-align:center;">Ingresa tu código de vendedor</p>
    <input type="password" id="accessCode" placeholder="Código de acceso">
    <button onclick="verificarAcceso()">Entrar</button>
    <p id="loginError">Código incorrecto.</p>
  </div>

  <div id="appContent" class="hidden-app">
    <div class="ambient">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="grid-overlay"></div>
    </div>

    <header class="seller-header">
      <div class="seller-brand">
        <span class="brand-mark">🌹</span>
        <div class="brand-text">
          <span class="brand-name">SHOP ROSES</span>
          <span class="brand-tag">PANEL VENDEDOR</span>
        </div>
      </div>
      <div class="header-right">
        <button class="btn-refresh" id="btnRefresh" title="Actualizar pedidos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
      </div>
    </header>

    <section class="status-bar">
      <div class="status-card pendientes">
        <span class="status-label">Pendientes</span>
        <span class="status-num" id="countPendientes">0</span>
      </div>
      <div class="status-card success">
        <span class="status-label">Empacados hoy</span>
        <span class="status-num" id="countEmpacados">0</span>
      </div>
      <div class="status-card money">
        <span class="status-label">Ventas hoy</span>
        <span class="status-num" id="countVentas">$0</span>
      </div>
      <div class="status-live" id="liveIndicator">
        <span class="live-dot"></span>
        <span id="liveText">En vivo</span>
      </div>
    </section>

    <section class="search-section">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchPedido" placeholder="Buscar por ID o producto...">
      </div>
    </section>

    <main class="pedidos-grid" id="pedidosList"></main>

    <div class="empty-state" id="emptyState" style="display:none">
      <div class="empty-icon">✅</div>
      <h2>Todo al día</h2>
      <p>No hay pedidos pendientes por empacar</p>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="confirm-overlay" id="confirmOverlay">
      <div class="confirm-box">
        <div class="confirm-icon">📦</div>
        <h3>¿Empacar este pedido?</h3>
        <p id="confirmText">Pedido #</p>
        <div class="confirm-actions">
          <button class="btn-secondary" id="btnCancel">Cancelar</button>
          <button class="btn-confirm" id="btnConfirm">Sí, empacar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="vendedor.js"></script>
  <script>
    // Lógica de contraseña para vendedores (Sin memoria, pide siempre)
    function verificarAcceso() {
      const code = document.getElementById('accessCode').value.trim();
      if (code === 'v_shoproses') {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appContent').classList.remove('hidden-app');
      } else {
        document.getElementById('loginError').style.display = 'block';
        document.getElementById('accessCode').value = '';
      }
    }

    document.getElementById('accessCode').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') verificarAcceso();
    });
  </script>
</body>
</html>
